<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Upkeep</title>
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171d" media="(prefers-color-scheme: dark)">
<meta name="description" content="Rotina, exercício e trabalho, com sequências e listas editáveis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;-webkit-tap-highlight-color:transparent}
/* Layout: phone-first single column. Home = bar tracker + three doors (Upkeep, Exercise, Work). Each door opens its own screen with a back button; Upkeep and Work have an Edit mode; Settings holds language, sync and backup. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1d2733; --muted:#5f6b78; --line:#dde3ea;
  --accent:#e2a028; --accent-ink:#3a2700; --done:#2f7d6b; --done-soft:#d9eee8;
  --exercise:#3d6fb6; --exercise-soft:#dfe8f6; --work:#7a4f9e; --work-soft:#ece3f4; --danger:#c0392b;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --ink:#e7ecf1; --muted:#97a3b0; --line:#2b3540;
  --accent:#f0b546; --accent-ink:#2a1c00; --done:#5cc1a8; --done-soft:#1d3b35;
  --exercise:#7ea6e6; --exercise-soft:#1e2c42; --work:#b893dc; --work-soft:#2e2440; --danger:#f07a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e7ecf1; --muted:#97a3b0; --line:#2b3540;
  --accent:#f0b546; --accent-ink:#2a1c00; --done:#5cc1a8; --done-soft:#1d3b35;
  --exercise:#7ea6e6; --exercise-soft:#1e2c42; --work:#b893dc; --work-soft:#2e2440; --danger:#f07a6c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.15rem;font-weight:700}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Home */
.hello-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column;gap:4px;min-width:0}
.hello p{margin:0;color:var(--muted)}
.gear{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;cursor:pointer}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar-head b{font-weight:600}
.bar-head span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.track{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--done);transition:width .4s ease}
.track.weekly i{background:var(--accent)}
.track.ex i{background:var(--exercise)}
.track.work i{background:var(--work)}
.week{display:flex;flex-direction:column;gap:12px}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.week-head span{font-size:.85rem;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.col .stack{flex:1;width:100%;max-width:40px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.col .fill{width:100%;background:color-mix(in srgb,var(--done) 45%,var(--line));border-radius:8px 8px 0 0;transition:height .4s ease}
.col.good .fill{background:var(--done)}
.col.today .stack{outline:2px solid var(--accent);outline-offset:2px}
.col .day{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
.col .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.col .dot.on{background:var(--exercise);border-color:var(--exercise)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:18px;padding:18px 16px;cursor:pointer;min-height:150px;transition:transform .12s;color:#fff;min-width:0}
.door:active{transform:scale(.98)}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.door svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.door strong{font-family:var(--display);font-size:1.35rem}
.door small{font-size:.85rem;opacity:.85}
.door.upkeep{background:var(--done)}
.door.exercise{background:var(--exercise)}
.door.work{background:var(--work);grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.door.work .dtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .door{color:#0d1318}}
:root[data-theme="dark"] .door{color:#0d1318}

/* Screen header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back,.edit-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.edit-btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Upkeep / Work task lists */
.daynav{display:flex;align-items:center;gap:8px}
.daynav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav .date{flex:1;min-width:0}
.daynav .date strong{display:block;font-family:var(--display);font-size:1.25rem}
.today-btn{width:auto!important;padding:0 12px;font-size:.85rem!important}
.summary{display:flex;align-items:center;gap:18px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .rtrack{stroke:var(--line)}
.ring .rfill{stroke:var(--done);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring.work .rfill{stroke:var(--work)}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:22px}
.summary p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.streak{font-family:var(--display);font-size:1.05rem;font-weight:700}
.group{display:flex;flex-direction:column;gap:8px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link-btn{background:none;border:0;color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline}
.tasks{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s}
.task:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .15s}
.box svg{width:16px;height:16px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.task.done{background:var(--done-soft);border-color:transparent}
.task.done .box{background:var(--done);border-color:var(--done)}
.task.done .box svg{opacity:1}
.work-list .task.done{background:var(--work-soft)}
.work-list .task.done .box{background:var(--work);border-color:var(--work)}
.todo-list .task.done .name{text-decoration:line-through;color:var(--muted)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .name{font-weight:600}
.task .hint{font-size:.85rem;color:var(--muted)}
.task .area{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chip.hot{color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:999px}
.empty{color:var(--muted);font-size:.92rem;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;margin:0}
.tip{font-size:.88rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin:0}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.field{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;width:100%}
.field::placeholder{color:var(--muted)}
.btn-solid{border:0;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer;background:var(--work);color:var(--surface)}

/* Edit mode */
.edit-row{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.edit-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.edit-fields .field{padding:8px 10px}
.edit-fields .e-name{font-weight:600}
.edit-fields .row2{display:flex;gap:6px}
.edit-fields .row2 .e-area{flex:0 0 34%}
.edit-actions{display:flex;flex-direction:column;gap:4px}
.icon-btn{width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:1rem;line-height:1}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.del{color:var(--danger)}
.icon-btn.del.armed{background:var(--danger);color:var(--surface);border-color:var(--danger);width:auto;padding:0 8px;font-size:.78rem;font-weight:700}
.add-btn{border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:12px;font-weight:600;cursor:pointer;text-align:center}
.edit-note{font-size:.85rem;color:var(--muted);margin:0}

/* Exercise */
.lib-intro{margin:0;color:var(--muted);font-size:.92rem}
.lib{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lib summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;cursor:pointer;font-weight:600;list-style:none}
.lib summary::-webkit-details-marker{display:none}
.lib summary::after{content:"+";font-family:var(--display);font-size:1.3rem;color:var(--muted);line-height:1}
.lib[open] summary::after{content:"–"}
.lib summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lib summary span:first-child{flex:1;min-width:0}
.lib .count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lib ul{list-style:none;margin:0;padding:0 14px 8px;display:flex;flex-direction:column}
.lib li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.lib li b{font-weight:600}
.lib li span{font-size:.88rem;color:var(--muted)}
.log-btn{border:2px solid var(--exercise);background:transparent;color:var(--exercise);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
.log-btn.on{background:var(--exercise);color:var(--surface)}
.log-btn.big{width:100%;padding:16px;font-size:1.05rem}

.backup{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.backup button,.backup label{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;cursor:pointer}
.backup label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.backup input{position:absolute;opacity:0;width:1px;height:1px}
#installBtn{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.status{font-size:.8rem;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.dot-s{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot-s.ok{background:var(--done)}.dot-s.busy{background:var(--accent)}.dot-s.err{background:var(--danger)}

/* Workout planner */
.today-card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:18px;padding:18px 16px;background:var(--exercise);color:#fff;cursor:pointer;transition:transform .12s}
.today-card:active{transform:scale(.99)}
.today-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tc-letter{width:58px;height:58px;flex:none;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.9rem;background:rgba(255,255,255,.18)}
.tc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tc-txt .label{color:inherit;opacity:.8}
.tc-txt strong{font-family:var(--display);font-size:1.35rem}
.tc-txt small{font-size:.88rem;opacity:.9}
.tc-go{font-size:2rem;line-height:1;opacity:.8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .today-card{color:#0d1318}:root:not([data-theme="light"]) .tc-letter{background:rgba(0,0,0,.12)}}
:root[data-theme="dark"] .today-card{color:#0d1318}
.split{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.split button{flex:1 0 auto;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 6px;cursor:pointer}
.split button b{font-family:var(--display);font-size:1.1rem}
.split button small{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.split button.sel{background:var(--exercise);border-color:var(--exercise);color:var(--surface)}
.split button.sel small{color:inherit;opacity:.85}
.split button.today{box-shadow:inset 0 -3px 0 var(--accent)}
.wo-sub{margin:4px 0 0;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:10px}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.meter-head span{font-family:var(--display);font-weight:700;font-size:1.1rem}
.meter-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:56px}
.meter-bar button{border:0;border-radius:8px;background:var(--line);cursor:pointer;padding:0;transition:background .15s}
.meter-bar button:nth-child(1){height:30%}.meter-bar button:nth-child(2){height:47%}.meter-bar button:nth-child(3){height:64%}.meter-bar button:nth-child(4){height:82%}.meter-bar button:nth-child(5){height:100%}
.meter-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600}
.meter p{margin:0;color:var(--muted);font-size:.9rem}
.wo-list .task .name{font-weight:600}
.wo-list .amt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--exercise)}
.wo-list .task.done{background:var(--exercise-soft)}
.wo-list .task.done .box{background:var(--exercise);border-color:var(--exercise)}

/* Workout timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer.work{background:var(--exercise)}
.t-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.t-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-info .label{color:inherit;opacity:.75}
.t-row{display:flex;align-items:baseline;gap:10px;min-width:0}
.t-row strong{font-family:var(--display);font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1}
.t-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.t-info small{opacity:.85;font-size:.82rem}
.timer button{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:10px;height:44px;padding:0 12px;font-weight:700;cursor:pointer;flex:none}
#workout.timing{padding-bottom:100px}
.wo-list .task.active{border-color:var(--exercise);box-shadow:inset 0 0 0 1px var(--exercise)}
.sets{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.sets i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.sets i.on{background:var(--exercise)}
.sub{font-size:.78rem;color:var(--muted);margin-top:4px;font-weight:600}
.sets .sub{margin:0 0 0 6px}
/* Difficulty feedback */
.feel{display:flex;flex-direction:column;gap:10px}
.feel-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel-btns button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 6px;font-weight:600;cursor:pointer}
.feel-btns button.sel{background:var(--exercise);border-color:var(--exercise);color:var(--surface)}
.feel p{margin:0;color:var(--muted);font-size:.9rem}
.btn-try{align-self:flex-start;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer}
/* Stats */
.week-head .right{display:flex;align-items:baseline;gap:10px}
.stack-card{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.82rem;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head strong{font-family:var(--display);font-size:1.1rem}
.cal-head button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.cal-head button:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}
.cal-grid button{aspect-ratio:1;max-width:100%;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font-size:.82rem;font-variant-numeric:tabular-nums;position:relative;cursor:pointer;padding:0}
.cal-grid button[data-l="1"]{background:color-mix(in srgb,var(--done) 25%,var(--bg))}
.cal-grid button[data-l="2"]{background:color-mix(in srgb,var(--done) 55%,var(--bg))}
.cal-grid button[data-l="3"]{background:var(--done);color:var(--surface);font-weight:700}
.cal-grid button.today{outline:2px solid var(--accent);outline-offset:1px}
.cal-grid button.future{opacity:.35;cursor:default}
.cal-grid button i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--exercise)}
.cal-grid button[data-l="3"] i{background:var(--surface)}
.rates{display:flex;flex-direction:column;gap:12px}
.rate{display:flex;flex-direction:column;gap:5px}
.rate-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.92rem}
.rate-head b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rate-head span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.rate .track{height:8px}
.rate.low .track i{background:var(--accent)}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:110px}
.mini .col .fill{background:var(--exercise)}
.mini .num{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.mini .day{white-space:normal;text-align:center;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.82rem}
/* Settings */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font-weight:600;cursor:pointer}
.seg button.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.form{display:flex;flex-direction:column;gap:8px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--done);border-color:var(--done);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:0;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--danger)}
.msg:empty{display:none}
.who{font-weight:600;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

        <small id="doorUpkeep"></small>

        <small id="doorExercise"></small>

      </button>
    </section>

    <section class="card week">

        <span><i style="background:var(--exercise);border-radius:50%"></i><span data-t="legend_wo"></span></span>

      <div class="status"><span class="dot-s" id="statusDot"></span><span id="status"></span></div>
    </section>
  </main>

  <!-- UPKEEP -->
  <main class="screen" id="upkeep" hidden>
    <div class="topbar"><button class="back" data-back data-t="back_home"></button><button class="edit-btn" data-edit="upkeep"></button></div>
    <div id="upkeepView" class="screen">
      <div class="daynav">
        <button id="prev" data-ta="prev_day">‹</button>
        <div class="date"><span class="label" id="dayLabel"></span><strong id="dateText"></strong></div>
        <button id="next" data-ta="next_day">›</button>
        <button id="goToday" class="today-btn" data-t="today"></button>
      </div>
      <div class="card summary">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="rtrack" cx="50" cy="50" r="40"/>
          <circle class="rfill" id="ringFill" cx="50" cy="50" r="40" transform="rotate(-90 50 50)" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
          <text id="ringText" x="50" y="58" text-anchor="middle">0/0</text>
        </svg>
        <div><div class="streak" id="streakText"></div><p id="summaryText"></p></div>
      </div>

      <section class="group"><h2 data-t="every_week"></h2><ul class="tasks" id="edWeekly"></ul></section>
    </div>
  </main>

  <!-- EXERCISE -->
  <main class="screen" id="exercise" hidden>

    <section class="group">
      <h2 data-t="library"></h2>
      <p class="lib-intro" data-t="lib_intro"></p>
      <div class="group" id="library"></div>
    </section>
  </main>

    </section>
  </main>

function renderUpkeep(){

  const diff=Math.round((todayNoon()-viewDate)/864e5);
  $("dayLabel").textContent=isToday?tr("today"):diff===1?tr("yesterday"):tr("days_ago",diff);
  $("dateText").textContent=fmtLong(viewDate);
  $("next").disabled=isToday; $("goToday").hidden=isToday;
  const done=doneOn(k), count=dailyDone(k), g=goodN();
  $("ringText").textContent=`${count}/${nD}`;
  $("ringFill").setAttribute("stroke-dashoffset",251.3*(1-(nD?count/nD:0)));
  const gs=goodStreak();
  $("streakText").textContent=gs>0?tr("streak",gs):tr("streak_start");
  $("summaryText").textContent=!nD?tr("sum_none"):count>=g?(count===nD?tr("sum_all"):tr("sum_good")):tr("sum_more",g-count,g,nD);
  const ul=$("daily");ul.replaceChildren();
  if(!nD)ul.appendChild(emptyEl(tr("empty_daily")));
  L().daily.forEach(t=>{
    const s=taskStreak(t.id), chip=s>=2?`<span class="chip${s>=7?" hot":""}">${tr("chip_days",s)}</span>`:"";
    const li=taskEl(t,done.includes(t.id),chip,true); bindToggle(li,()=>toggleIn(state.days,k,t.id)); ul.appendChild(li);
  });
  const wk=isoWeek(viewDate), wdone=state.weeks[wk]||[];
  $("weekTitle").textContent=`${isoWeek(todayNoon())===wk?tr("this_week"):tr("week_n",+wk.split("-W")[1])} · ${weeklyDone(wk)}/${L().weekly.length}`;

  if(!L().weekly.length)wl.appendChild(emptyEl(tr("empty_weekly")));
  L().weekly.forEach(t=>{const li=taskEl(t,wdone.includes(t.id),"",true); bindToggle(li,()=>toggleIn(state.weeks,wk,t.id)); wl.appendChild(li)});
}

    const name=field("e-name","name","task_name");
    const row2=document.createElement("div");row2.className="row2";
    if(opts.area)row2.appendChild(field("e-area","area","area"));
    row2.appendChild(field("","hint","note"));

    const up=mkb("↑","move_up"),down=mkb("↓","move_down"),del=mkb("✕","del","del");
    up.disabled=i===0; down.disabled=i===list.length-1;
    up.onclick=()=>{[list[i-1],list[i]]=[list[i],list[i-1]];save();renderEditor(ulId,listName,opts)};
    down.onclick=()=>{[list[i+1],list[i]]=[list[i],list[i+1]];save();renderEditor(ulId,listName,opts)};
    del.onclick=()=>{

      list.splice(i,1);save();renderEditor(ulId,listName,opts);
    };
    act.append(up,down,del); li.append(f,act); ul.appendChild(li);

function amount(item,Lv){
  const step=item.u.startsWith("s")&&item.n>=20?5:1;
  const n=Math.max(1,Math.round(item.n*Lv.mult/step)*step);
  return {n,text:n+C().units[item.u]};
}
function planMinutes(letter,lv){
  const P=plan(letter),Lv=LEVELS[lv-1],sets=P.rest?1:Lv.sets;let sec=0;
  P.items.forEach(it=>{const {n}=amount(it,P.rest?LEVELS[2]:Lv);const both=/leg|side/.test(it.u)?2:1;const work=it.u.startsWith("s")?n*both:n*3*both;sec+=sets*(work+(P.rest?10:Lv.rest))});
  if(!P.rest)sec+=4*60+P.cool.length*60;
  return Math.max(5,Math.round(sec/300)*5);
}

function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(freq,dur){try{if(!actx)return;const t0=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+.05)}catch(e){}}
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}else if(!on&&wake){const w=wake;wake=null;await w.release()}}catch(e){}}
const fmt=x=>`${Math.floor(x/60)}:${String(x%60).padStart(2,"0")}`;
function startTimer(o){unlockAudio();timer={...o,end:Date.now()+o.secs*1000,last:null};keepAwake(true);tick()}
function stopTimer(){timer=null;clearTimeout(tickH);$("timer").hidden=true;$("workout").classList.remove("timing");keepAwake(false)}
function tick(){
  clearTimeout(tickH); if(!timer){stopTimer();return}
  const left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  $("timer").hidden=false;$("workout").classList.add("timing");
  $("timer").className="timer "+timer.kind;
  $("tLabel").textContent=timer.kind==="rest"?tr("t_rest"):tr("t_go");
  $("tName").textContent=timer.label;$("tTime").textContent=fmt(left);$("tNext").textContent=timer.next||"";
  if(left<=3&&left>0&&timer.last!==left){timer.last=left;beep(660,.09)}
  if(left<=0){
    const t=timer;timer=null;beep(990,.4);
    try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
    if(t.onDone)t.onDone();
    if(!timer)stopTimer();
    renderWorkout();return;
  }
  tickH=setTimeout(tick,250);
}

function toggleCheck(id){woChecked.has(id)?woChecked.delete(id):woChecked.add(id);renderWorkout()}
function nextMove(P,Lv,i){for(let j=1;j<P.items.length;j++){const k=(i+j)%P.items.length;if((woProg["m"+k]||0)<Lv.sets)return moveName(P.items[k],Lv,P)}return null}
function tapSet(id,i,it,name,a,Lv,P){
  if(timer&&timer.row===id)return;
  const sd=woProg[id]||0;
  if(sd>=Lv.sets){woProg[id]=0;renderWorkout();return}
  const finish=()=>{
    woProg[id]=(woProg[id]||0)+1;
    if(woProg[id]<Lv.sets)startTimer({label:name,secs:Lv.rest,kind:"rest",next:tr("t_next_set",woProg[id]+1,Lv.sets)});
    else{const n=nextMove(P,Lv,i);if(n)startTimer({label:tr("t_next_move"),secs:Lv.rest,kind:"rest",next:tr("t_next",n)});else stopTimer()}
    renderWorkout();
  };
  if(timed(it))startTimer({label:name,secs:workSecs(it,a),kind:"work",row:id,next:tr("t_set_of",sd+1,Lv.sets)+(it.u==="s/side"?tr("t_switch"):""),onDone:finish});
  else finish();
  renderWorkout();
}
function tapCircuit(id,it,name,a,Lv,P){
  if(woCircuitDone||(timer&&timer.row===id))return;
  if(woRoundDone.has(id)){woRoundDone.delete(id);renderWorkout();return}
  const mark=()=>{
    woRoundDone.add(id);
    if(woRoundDone.size>=P.items.length){
      if(woRound<Lv.sets){woRound++;woRoundDone.clear();startTimer({label:tr("t_round_done"),secs:Lv.rest,kind:"rest",next:tr("t_next_round",woRound,Lv.sets)})}
      else{woCircuitDone=true;stopTimer()}

    renderWorkout();
  };
  if(timed(it))startTimer({label:name,secs:workSecs(it,a),kind:"work",row:id,next:tr("t_round_of",woRound,Lv.sets),onDone:mark});
  else mark();

}

/* ================= Difficulty feedback ================= */
function feelMsg(r){
  const b=r.level, nx=r.next!=null?r.next:(r.feel==="easy"?Math.min(5,b+1):r.feel==="hard"?Math.max(1,b-1):b);
  if(r.applied)return tr("feel_next",r.applied,lvName(r.applied));
  if(r.suggest)return tr("feel_ready",b);
  if(r.feel==="easy")return nx>b?tr("feel_next",nx,lvName(nx)):tr("feel_top");
  if(r.feel==="hard")return nx<b?tr("feel_next",nx,lvName(nx))+tr("feel_form"):tr("feel_bottom");
  return tr("feel_stay",b,lvName(b));
}
function renderFeel(){
  const k=key(todayNoon()),done=state.workouts[k],rec=state.feedback[k];
  $("feel").hidden=!done||done==="R"; if($("feel").hidden)return;
  document.querySelectorAll("[data-feel]").forEach(b=>{const on=!!(rec&&rec.feel===b.dataset.feel);b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on)});
  $("feelMsg").textContent=rec?feelMsg(rec):tr("feel_prompt");
  $("feelTry").hidden=!(rec&&rec.suggest); if(rec&&rec.suggest)$("feelTry").textContent=tr("feel_try",rec.suggest,lvName(rec.suggest));
}
document.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{
  const k=key(todayNoon()), prev=state.feedback[k], base=prev?prev.level:level(), feel=b.dataset.feel;
  let next=base,suggest=null;
  if(feel==="easy")next=Math.min(5,base+1);
  else if(feel==="hard")next=Math.max(1,base-1);
  else{const recent=Object.keys(state.feedback).filter(d=>d<k).sort().slice(-2).map(d=>state.feedback[d]);
    if(base<5&&recent.length===2&&recent.every(r=>r.feel==="right"&&r.level===base))suggest=base+1}
  state.feedback[k]={letter:state.workouts[k],level:base,feel,next,suggest};state.level=next;save();renderAll();
});
$("feelTry").onclick=()=>{const k=key(todayNoon()),r=state.feedback[k];if(!r||!r.suggest)return;state.level=r.suggest;state.feedback[k]={...r,applied:r.suggest,suggest:null};save();renderAll()};

    .forEach(r=>wr.appendChild(rateRow(txt(r.task,"name")||tr("untitled"),r.c,W,r.c/W<.5,"")));

  const mx=Math.max(1,...Object.values(letterC));const mini=$("woMini");mini.replaceChildren();
  Object.entries(letterC).forEach(([x,c])=>{const col=document.createElement("div");col.className="col";
    col.innerHTML=`<span class="num">${c}</span><div class="stack"><div class="fill" style="height:${c/mx*100}%"></div></div><div class="day"></div>`;
    col.querySelector(".day").textContent=`${x} · ${plan(x).title.split(" ")[0]}`;mini.appendChild(col)});
  const ch=$("woChips");ch.replaceChildren();
  [tr("ch_wo",wo30),tr("ch_easy",feelC.easy),tr("ch_right",feelC.right),tr("ch_hard",feelC.hard),tr("ch_level",level(),lvName(level()))]
    .forEach(x=>{const sp=document.createElement("span");sp.textContent=x;ch.appendChild(sp)});
}
$("calPrev").onclick=()=>{calOffset--;renderStats()};
$("calNext").onclick=()=>{if(calOffset<0){calOffset++;renderStats()}};
$("goStats").onclick=()=>{calOffset=0;go("stats")};

/* ================= Saving ================= */
function toggleIn(store,k,id){const a=store[k]||[];store[k]=a.includes(id)?a.filter(x=>x!==id):[...a,id];if(!store[k].length)delete store[k];save();renderAll()}
function persist(){try{localStorage.setItem("upkeep",JSON.stringify(state))}catch(e){flash(tr("st_storage"))}}
function save(){stamp();persist();scheduleSync()}
function renderAll(){renderHome();renderUpkeep();renderWork();renderExercise();renderWorkout();renderStats();renderSettings()}

/* ================= Sync =================
   Every day, week and list is stamped with the time it last changed.
   When two devices meet, the newer version of each one wins, so ticking
   and un-ticking both carry over correctly. */
const SYNC_FIELDS=["days","weeks","workouts","workDays","feedback","todoDone"];
const LIST_NAMES=["daily","weekly","workDaily","workTodo"];
const syncReady=()=>!!(SUPA.url&&SUPA.key);
function flatten(s){const f={};SYNC_FIELDS.forEach(n=>{for(const [k,v] of Object.entries(s[n]||{}))f[n+"|"+k]=v});LIST_NAMES.forEach(n=>{if(s.lists&&Array.isArray(s.lists[n]))f["lists|"+n]=s.lists[n]});if(s.level!=null)f.level=s.level;return f}
function strMap(f){const o={};for(const k in f)o[k]=JSON.stringify(f[k]);return o}
function sameMap(a,b){const ka=Object.keys(a),kb=Object.keys(b);if(ka.length!==kb.length)return false;return ka.every(k=>a[k]===b[k])}
function unflatten(f){const s={lists:{}};SYNC_FIELDS.forEach(n=>s[n]={});for(const [p,v] of Object.entries(f)){const i=p.indexOf("|");if(i<0){if(p==="level")s.level=v;continue}const n=p.slice(0,i),k=p.slice(i+1);if(n==="lists")s.lists[k]=v;else if(s[n])s[n][k]=v}s.lists=normalizeLists(s.lists);if(s.level==null)s.level=3;return s}
let lastFlat=null;
function stamp(){const cur=strMap(flatten(state)),now=Date.now();state.meta=state.meta||{};if(lastFlat){new Set([...Object.keys(cur),...Object.keys(lastFlat)]).forEach(k=>{if(cur[k]!==lastFlat[k])state.meta[k]=now})}lastFlat=cur}
function mergeStates(ls,lm,rs,rm){
  const lf=flatten(ls),rf=flatten(rs),flat={},meta={};
  new Set([...Object.keys(lf),...Object.keys(rf),...Object.keys(lm),...Object.keys(rm)]).forEach(k=>{
    const lt=lm[k]||0,rt=rm[k]||0;let v;
    if(lt>rt)v=lf[k];else if(rt>lt)v=rf[k];
    else{const a=lf[k],b=rf[k];v=(Array.isArray(a)&&Array.isArray(b)&&!k.startsWith("lists|"))?[...new Set([...b,...a])]:(b!==undefined?b:a)}
    if(v!==undefined)flat[k]=v;const m=Math.max(lt,rt);if(m)meta[k]=m;
  });
  return {flat,meta};
}
const pick=s=>({days:s.days,weeks:s.weeks,workouts:s.workouts,workDays:s.workDays,feedback:s.feedback,todoDone:s.todoDone,lists:s.lists,level:s.level});

let auth=null;try{auth=JSON.parse(lsGet("upkeep-auth")||"null")}catch(e){}
let syncState="idle",syncing=false,syncAgain=false,syncTimer=null,lastSyncAt=Number(lsGet("upkeep-lastsync"))||0,flashTimer=null,flashText="";
function setAuth(j){auth={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user.id,email:j.user.email}};lsSet("upkeep-auth",JSON.stringify(auth))}
function signOutLocal(msgKey){auth=null;lsSet("upkeep-auth",null);syncState="idle";if(msgKey)syncMsg(tr(msgKey),msgKey==="expired");renderSettings();renderStatus()}
class SyncError extends Error{constructor(m,kind){super(m);this.kind=kind}}
async function token(){
  if(auth.expires_at*1000-Date.now()>60000)return auth.access_token;
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",cache:"no-store",headers:{apikey:SUPA.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:auth.refresh_token})});
  if(!r.ok){if(r.status===400||r.status===401||r.status===403){signOutLocal("expired");throw new SyncError(tr("expired"),"auth")}throw new SyncError("HTTP "+r.status)}
  setAuth(await r.json());return auth.access_token;
}
async function api(path,opt={},retry=true){
  const tok=await token();
  const r=await fetch(SUPA.url+path,{...opt,cache:"no-store",headers:{apikey:SUPA.key,Authorization:"Bearer "+tok,"Content-Type":"application/json",...(opt.headers||{})}});
  if(r.status===401&&retry&&auth){auth.expires_at=0;return api(path,opt,false)}
  return r;
}
function scheduleSync(){if(!syncReady()||!auth)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500)}
async function syncNow(){
  if(!syncReady()||!auth)return;
  if(editing||syncing){syncAgain=true;return}
  if(!navigator.onLine){syncState="offline";renderStatus();return}
  syncing=true;syncState="syncing";renderStatus();
  try{
    const r=await api(`/rest/v1/upkeep_state?select=data&user_id=eq.${encodeURIComponent(auth.user.id)}&_=${Date.now()}`);
    if(r.status===404)throw new SyncError(tr("err_db"),"db");
    if(!r.ok)throw new SyncError("HTTP "+r.status);
    const rows=await r.json(),remote=rows[0]&&rows[0].data||null;
    const rs=(remote&&remote.state)||{},rm=(remote&&remote.meta)||{};
    if(editing){syncAgain=true;return}
    stamp();
    const {flat,meta}=mergeStates(state,state.meta||{},rs,rm);
    const mStr=strMap(flat),localChanged=!sameMap(mStr,strMap(flatten(state)));
    const remoteChanged=!remote||!sameMap(mStr,strMap(flatten(rs)))||JSON.stringify(meta)!==JSON.stringify(rm);
    if(localChanged){Object.assign(state,unflatten(flat))}
    state.meta=meta;lastFlat=strMap(flatten(state));persist();
    if(localChanged)renderAll();
    if(remoteChanged){
      const p=await api("/rest/v1/upkeep_state",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:auth.user.id,data:{v:1,state:pick(state),meta:state.meta},updated_at:new Date().toISOString()})});
      if(p.status===404)throw new SyncError(tr("err_db"),"db");
      if(!p.ok)throw new SyncError("HTTP "+p.status);
    }
    lastSyncAt=Date.now();lsSet("upkeep-lastsync",String(lastSyncAt));syncState="ok";
  }catch(e){
    if(e instanceof TypeError){syncState="offline"}
    else{syncState=auth?"error":"idle";if(e.kind==="db")syncMsg(e.message,true)}
  }finally{
    syncing=false;renderStatus();renderSettings();
    if(syncAgain){syncAgain=false;scheduleSync()}
  }
}
window.addEventListener("online",()=>syncNow());
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(!editing)renderAll();syncNow()}});
setInterval(()=>{if(!document.hidden)syncNow()},60000);

function fmtTime(ts){const d=new Date(ts),sameDay=key(d)===key(new Date());const t=d.toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"});return sameDay?t:`${d.toLocaleDateString(locale(),{day:"numeric",month:"short"})} ${t}`}
function statusLine(){
  if(flashText)return [flashText,""];
  if(!syncReady()||!auth)return [tr("st_local"),""];
  if(syncState==="syncing")return [tr("st_syncing"),"busy"];
  if(syncState==="offline")return [tr("st_offline"),"err"];
  if(syncState==="error")return [tr("st_err"),"err"];
  return [lastSyncAt?tr("st_synced",fmtTime(lastSyncAt)):tr("st_syncing"),lastSyncAt?"ok":"busy"];
}
function renderStatus(){const [s,c]=statusLine();$("status").textContent=s;$("statusDot").className="dot-s"+(c?" "+c:"");$("statusDot").hidden=!c}
function flash(s){flashText=s;renderStatus();clearTimeout(flashTimer);flashTimer=setTimeout(()=>{flashText="";renderStatus()},5000)}
function syncMsg(s,err){$("syncMsg").textContent=s||"";$("syncMsg").classList.toggle("err",!!err)}
function renderSettings(){
  const ready=syncReady();
  $("syncUnconf").hidden=ready;
  $("authForm").hidden=!ready||!!auth;
  $("signedIn").hidden=!ready||!auth;
  if(auth){$("signedAs").textContent=auth.user.email||"";$("lastSync").textContent=tr("last_sync",lastSyncAt?fmtTime(lastSyncAt):tr("never"))}
  $("syncNowBtn").disabled=syncing;
}
function busy(on){["signInBtn","signUpBtn"].forEach(id=>$(id).disabled=on)}
async function doAuth(mode){
  const email=$("authEmail").value.trim(),pw=$("authPw").value;
  if(!/^\S+@\S+\.\S+$/.test(email))return syncMsg(tr("err_email"),true);
  if(pw.length<6)return syncMsg(tr("err_pw"),true);
  busy(true);syncMsg("");
  try{
    const path=mode==="in"?"/auth/v1/token?grant_type=password":"/auth/v1/signup";
    const r=await fetch(SUPA.url+path,{method:"POST",cache:"no-store",headers:{apikey:SUPA.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      const c=String(j.error_code||j.code||j.error||""),m=String(j.msg||j.error_description||j.message||("HTTP "+r.status));
      if(/invalid_credentials|invalid_grant/.test(c)||/invalid login/i.test(m))throw new Error(tr("err_cred"));
      if(/email_not_confirmed/.test(c)||/not confirmed/i.test(m))throw new Error(tr("err_notconf"));
      if(/user_already_exists|email_exists/.test(c)||/already registered/i.test(m))throw new Error(tr("err_exists"));
      if(/weak_password/.test(c))throw new Error(tr("err_pw"));
      if(/email_address_invalid/.test(c))throw new Error(tr("err_email"));
      throw new Error(tr("err_generic",m));
    }
    if(!j.access_token){syncMsg(tr("err_confirm"));return}
    setAuth(j);$("authPw").value="";renderSettings();
    await syncNow();
    if(syncState==="ok")syncMsg(tr("first_sync"));
  }catch(err){syncMsg(err instanceof TypeError?tr("err_net"):err.message,true)}
  finally{busy(false);renderSettings()}
}
$("authForm").onsubmit=e=>{e.preventDefault();doAuth("in")};
$("signUpBtn").onclick=()=>doAuth("up");
$("syncNowBtn").onclick=async()=>{syncMsg("");await syncNow();if(syncState==="offline")syncMsg(tr("err_net"),true)};
$("signOutBtn").onclick=()=>{const tok=auth&&auth.access_token;if(tok&&navigator.onLine)fetch(SUPA.url+"/auth/v1/logout",{method:"POST",headers:{apikey:SUPA.key,Authorization:"Bearer "+tok}}).catch(()=>{});signOutLocal();syncMsg(tr("signed_out"))};

/* ================= Navigation (works with the phone's back button) ================= */
const SCREENS=["home","upkeep","exercise","work","workout","stats","settings"];
function show(name){
  if(!SCREENS.includes(name))name="home";
  if(editing)setEditing(null);
  SCREENS.forEach(s=>$(s).hidden=s!==name);
  if(name==="upkeep")viewDate=todayNoon();
  renderAll(); window.scrollTo(0,0);
}
function go(name){history.pushState({s:name},"","#"+name);show(name)}
window.addEventListener("popstate",()=>show(location.hash.slice(1)||"home"));
$("goUpkeep").onclick=()=>go("upkeep");
$("goExercise").onclick=()=>go("exercise");
$("goWork").onclick=()=>go("work");
$("goSettings").onclick=()=>{syncMsg("");$("backupMsg").textContent="";go("settings")};
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{if(history.state&&history.state.s)history.back();else{history.replaceState(null,"","#home");show("home")}});
$("prev").onclick=()=>{viewDate=addDays(viewDate,-1);renderUpkeep()};
$("next").onclick=()=>{if(key(viewDate)!==key(todayNoon())){viewDate=addDays(viewDate,1);renderUpkeep()}};
$("goToday").onclick=()=>{viewDate=todayNoon();renderUpkeep()};

/* ================= Backup ================= */
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"daily-upkeep",version:4,saved:new Date().toISOString(),...pick(state)},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`daily-upkeep-${key(todayNoon())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  $("backupMsg").textContent=tr("backup_saved");
};
$("importFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||typeof d.days!=="object")throw 0;
    const merge=(dst,src)=>{for(const [k,v] of Object.entries(src||{}))if(Array.isArray(v))dst[k]=[...new Set([...(dst[k]||[]),...v])]};
    merge(state.days,d.days); merge(state.weeks,d.weeks); merge(state.workDays,d.workDays); merge(state.todoDone,d.todoDone);
    Object.assign(state.workouts,d.workouts||{});Object.assign(state.feedback,d.feedback||{});if(d.level)state.level=d.level;
    if(d.lists)state.lists=normalizeLists(d.lists);
    save();renderAll();$("backupMsg").textContent=tr("backup_loaded");
  }catch(err){$("backupMsg").textContent=tr("backup_bad")}
  e.target.value="";
};

/* ================= Install ================= */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").hidden=false});
$("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("installBtn").hidden=true};
window.addEventListener("appinstalled",()=>{$("installBtn").hidden=true;flash(tr("installed"))});

/* ================= Start ================= */
function normalizeLists(l){const out=clone(DEFAULT_LISTS);for(const n of Object.keys(out))if(Array.isArray(l&&l[n]))out[n]=l[n];return out}
try{
  const s=JSON.parse(localStorage.getItem("upkeep")||"null");
  if(s&&s.days)state={days:s.days||{},weeks:s.weeks||{},workouts:s.workouts||{},workDays:s.workDays||{},lists:normalizeLists(s.lists),level:s.level||3,feedback:s.feedback||{},todoDone:s.todoDone||{},meta:s.meta||{}};
}catch(e){}
lastFlat=strMap(flatten(state));
applyStatic();
buildLibrary();
history.replaceState({s:null},"","#home");
show("home");
syncNow();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
